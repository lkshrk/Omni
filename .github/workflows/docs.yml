name: Docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - mkdocs.yml
      - README.md
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - mkdocs.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          uv venv .tmp/docs-venv --python 3.13
          uv pip install --python .tmp/docs-venv/bin/python -r docs/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Build MkDocs site
        run: .tmp/docs-venv/bin/mkdocs build --strict

      - name: Check Markdown links and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          import unicodedata

          root = Path.cwd()
          docs = sorted((root / "docs").glob("*.md"))
          files = [root / "README.md", *docs]
          warnings = []
          bad_links = []
          placeholder_pattern = re.compile("|".join(["TO" + "DO", "TB" + "D", "FIX" + "ME"]))
          fence_pattern = re.compile(r"^\s*(?:```|~~~)")
          heading_pattern = re.compile(r"^(#{1,6})\s+(.*?)\s*$")
          attr_id_pattern = re.compile(r"\{[^}]*#([A-Za-z0-9_-]+)[^}]*\}\s*$")
          html_anchor_pattern = re.compile(r"<a\s[^>]*(?:id|name)=[\"']([^\"']+)[\"']", re.I)

          # Mirrors markdown.extensions.toc.slugify so a fragment is checked the way mkdocs renders it.
          def slugify(value):
              value = unicodedata.normalize("NFKD", value).encode("ascii", "ignore").decode("ascii")
              value = re.sub(r"[^\w\s-]", "", value).strip().lower()
              return re.sub(r"[-\s]+", "-", value)

          def anchors_of(text):
              found = set()
              seen = {}
              in_fence = False
              for line in text.splitlines():
                  if fence_pattern.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  found.update(a.lower() for a in html_anchor_pattern.findall(line))
                  match = heading_pattern.match(line)
                  if not match:
                      continue
                  title = match.group(2)
                  explicit = attr_id_pattern.search(title)
                  if explicit:
                      found.add(explicit.group(1).lower())
                      continue
                  title = re.sub(r"`([^`]*)`", r"\1", title)
                  title = re.sub(r"\[([^\]]*)\]\([^)]*\)", r"\1", title)
                  slug = slugify(title)
                  if not slug:
                      continue
                  count = seen.get(slug, 0)
                  seen[slug] = count + 1
                  found.add(slug if count == 0 else f"{slug}_{count}")
              return found

          anchors = {f.resolve(): anchors_of(f.read_text(encoding="utf-8")) for f in files if f.exists()}

          for file in files:
              text = file.read_text(encoding="utf-8")
              rel = file.relative_to(root)
              if not text.startswith("# "):
                  warnings.append(f"{rel}: missing H1")
              if placeholder_pattern.search(text):
                  warnings.append(f"{rel}: placeholder marker")
              for line_no, line in enumerate(text.splitlines(), start=1):
                  for match in re.finditer(r"\[[^\]]+\]\(([^)]+)\)", line):
                      href, _, fragment = match.group(1).partition("#")
                      if href.startswith(("http", "mailto:")):
                          continue
                      if not href and not fragment:
                          continue
                      target = (file.parent / href).resolve() if href else file.resolve()
                      if href and not target.exists():
                          bad_links.append(f"{rel}:{line_no} {href}")
                          continue
                      if not fragment or target.suffix != ".md" or target not in anchors:
                          continue
                      if fragment.lower() not in anchors[target]:
                          bad_links.append(f"{rel}:{line_no} {href}#{fragment}")

          if warnings:
              print("\n".join(warnings))
          if bad_links:
              print("\n".join(bad_links))
          if warnings or bad_links:
              sys.exit(1)
          print("structure: ok")
          print("links: ok")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy docs
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
