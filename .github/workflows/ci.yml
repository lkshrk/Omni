name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-config:
    name: Release Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: '~> v2'
          args: check

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Shell regression tests
        run: make test-scripts

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            packages: ./internal/app/...
          - name: cli
            packages: ./internal/cli/...
          - name: tui
            packages: ./internal/tui/...
          - name: remaining
            packages: remaining
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU Stow (required for dots integration coverage)
        if: matrix.name != 'remaining'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Race tests
        run: |
          packages='${{ matrix.packages }}'
          if [ "$packages" = remaining ]; then
            packages=$(go list ./... | grep -Ev '/internal/(app|cli|tui)(/|$)' | tr '\n' ' ')
          fi
          make test-unit TEST_PACKAGES="$packages"

  apm-platform-contracts:
    name: APM Platform Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned APM
        run: python -m pip install git+https://github.com/lkshrk/apm.git@3a0bd6e68485f32b7158a26074809bf3e9c9303b

      - name: Test portable APM target contracts
        run: go test ./internal/app -run '^TestAPM(Target|User)'

      - name: Test onboarding protocol and private-state contracts
        run: go test ./internal/securefile ./internal/config ./internal/apm ./internal/app -run 'Onboard|ImportSchema|DefaultStateDir|RootPrivate|RootRejects|VerifyDetects|CommitLegacyFragments|DescriptorRelative|WriteConfigLocks|InitDetects'

      - name: Test real stable-target MCP lifecycle
        run: go test -tags=integration ./internal/apm -run '^TestGlobalMCPLifecycleForEveryStableTarget$' -count=1

  onboarding-unit:
    name: Onboarding Unit (race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test onboarding coordinator, protocol, security, and CLI
        run: go test -race -count=1 ./internal/securefile ./internal/config ./internal/executor ./internal/apm ./internal/app ./internal/cli ./internal/tui -run 'Onboard|Legacy|CommitLegacyFragments|ImportSchema|DefaultStateDir|ActionCatalog|RootPrivate|RootRejects|APMCommand|DescriptorRelative|WriteConfigLocks|InitDetects'

  integration:
    name: Docker Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-ad
            packages: -parallel=8 -run=^TestCLI$$/^[ad] ./integration_tests/...
            cache: integration-cli-ad
          - name: cli-rest
            packages: -parallel=8 -run=^TestCLI$$/^[^ad] ./integration_tests/...
            cache: integration-tests
          - name: non-cli
            packages: -parallel=1 -skip=^TestCLI$$ ./integration_tests/...
            cache: integration-non-cli
          - name: providers
            packages: ./internal/provider/...
            cache: provider-tests
          - name: apm
            packages: ./internal/apm/... ./internal/cli/...
            cache: integration-apm
          - name: onboarding
            packages: -parallel=1 -run=TestAgentsOnboardRealPinnedAPM|TestAgentsOnboardProjectRealLocalAPM|TestTUIAgentsOnboarding ./internal/app/... ./integration_tests/...
            cache: integration-onboarding
    steps:
      - uses: actions/checkout@v7.0.1

      # container driver: type=gha export fails on the default docker driver
      - uses: docker/setup-buildx-action@v4.3.0

      # exposes the GHA runtime env that type=gha cache needs outside build-push-action
      - uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Integration tests in Docker
        run: make test-integration
        env:
          INTEGRATION_PACKAGES: ${{ matrix.packages }}
          DOCKER_TEST_CACHE: >-
            --cache-from type=gha,scope=integration-cli-ad
            --cache-from type=gha,scope=integration-tests
            --cache-from type=gha,scope=integration-non-cli
            --cache-from type=gha,scope=provider-tests
            --cache-from type=gha,scope=integration-apm
            --cache-from type=gha,scope=integration-onboarding
            --cache-to type=gha,scope=${{ matrix.cache }},mode=max
