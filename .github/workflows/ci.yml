name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-config:
    name: Release Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: '~> v2'
          args: check

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Shell regression tests
        run: make test-scripts

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            packages: ./internal/app/...
          - name: cli
            packages: ./internal/cli/...
          - name: tui
            packages: ./internal/tui/...
          - name: remaining
            packages: remaining
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU Stow (required for dots integration coverage)
        if: matrix.name != 'remaining'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Race tests
        shell: bash
        run: |
          set -o pipefail
          packages='${{ matrix.packages }}'
          if [ "$packages" = remaining ]; then
            packages=$(go list ./... | grep -Ev '/internal/(app|cli|tui)(/|$)' | tr '\n' ' ')
          fi
          evidence_dir="$RUNNER_TEMP/omni-test-evidence/unit-${{ matrix.name }}"
          mkdir -p "$evidence_dir"
          cat >"$evidence_dir/meta.json" <<'JSON'
          {"schema_version":1,"lane":"unit-${{ matrix.name }}","goos":"linux","tags":[],"count":1}
          JSON
          make --silent test-unit TEST_PACKAGES="$packages" TEST_FLAGS="-race -trimpath -count=1 -json" \
            | tee "$evidence_dir/go-test.jsonl"

      - name: Upload flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-evidence-unit-${{ matrix.name }}
          path: ${{ runner.temp }}/omni-test-evidence/unit-${{ matrix.name }}
          if-no-files-found: error

  apm-platform-contracts:
    name: APM Platform Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMNI_TEST_APPROVED_TOOLS: apm
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install APM from main
        run: |
          python -m pip install git+https://github.com/microsoft/apm.git@656f3d6e6dbade369b6fc8727a4eb7b164409b6d
          python -c 'import os, sysconfig; print(sysconfig.get_path("scripts"), file=open(os.environ["GITHUB_PATH"], "a"))'

      - name: Test portable APM target contracts
        run: go test ./internal/app -run '^TestAPM(Target|User)'

      - name: Test onboarding protocol and private-state contracts
        run: go test ./internal/config ./internal/apm ./internal/app -run 'Onboard|ImportSchema|DefaultStateDir|RootPrivate|RootRejects|VerifyDetects|CommitLegacyFragments|DescriptorRelative|WriteConfigLocks|InitDetects'

      - name: Test real stable-target MCP lifecycle
        run: go test -tags=integration ./internal/apm -run '^TestGlobalMCPLifecycleForEveryStableTarget$' -count=1

      # Skips off darwin; this is the only lane that runs it, and the path it guards writes.
      - name: Test Darwin legacy agents template is reported, never adopted
        run: go test ./internal/app -run '^TestAgentsAdoptReportsLegacyDarwinTemplateWithoutAdoptingIt$' -count=1

  onboarding-unit:
    name: Onboarding Unit (race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test onboarding coordinator, protocol, security, and CLI
        run: go test -race -count=1 ./internal/config ./internal/executor ./internal/apm ./internal/app ./internal/cli ./internal/tui -run 'Onboard|Legacy|CommitLegacyFragments|ImportSchema|DefaultStateDir|ActionCatalog|RootPrivate|RootRejects|APMCommand|DescriptorRelative|WriteConfigLocks|InitDetects'

  integration:
    name: Docker Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-ad
            packages: -parallel=8 -run=^TestCLI$$/^[ad] ./integration_tests/...
            cache: integration-cli-ad
          - name: cli-rest
            packages: -parallel=8 -run=^TestCLI$$/^[^ad] ./integration_tests/...
            cache: integration-tests
          - name: non-cli
            packages: -parallel=1 -skip=^(TestCLI$$|TestCLIBinary|TestCLIAndTUI|TestTUI) ./integration_tests/...
            cache: integration-non-cli
          - name: providers
            packages: ./internal/provider/...
            cache: provider-tests
          - name: apm
            packages: ./internal/apm/... ./internal/cli/...
            cache: integration-apm
          - name: onboarding
            packages: -parallel=1 -run=^(TestAgentsMigrationRealAPMLifecycle|TestAgentsManifestlessRealAPMLifecycle|TestTUIAgentsTabSyncsMCPThroughRealAPM)$$ ./internal/app/... ./integration_tests/...
            cache: integration-onboarding
          - name: realism
            packages: -parallel=1 -timeout=10m -run=^(TestCLIBinary.*|TestCLIAndTUI.*|TestTUI.*)$$ ./integration_tests/...
            cache: integration-realism
    steps:
      - uses: actions/checkout@v7.0.1

      # container driver: type=gha export fails on the default docker driver
      - uses: docker/setup-buildx-action@v4.3.0

      # exposes the GHA runtime env that type=gha cache needs outside build-push-action
      - uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Integration tests in Docker
        run: make test-integration
        env:
          INTEGRATION_PACKAGES: ${{ matrix.packages }}
          INTEGRATION_LANE: ${{ matrix.name }}
          DOCKER_TEST_CACHE: >-
            --cache-from type=gha,scope=integration-cli-ad
            --cache-from type=gha,scope=integration-tests
            --cache-from type=gha,scope=integration-non-cli
            --cache-from type=gha,scope=provider-tests
            --cache-from type=gha,scope=integration-apm
            --cache-from type=gha,scope=integration-onboarding
            --cache-from type=gha,scope=integration-realism
            --cache-to type=gha,scope=${{ matrix.cache }},mode=max

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-evidence-docker-${{ matrix.name }}
          path: .tmp/test-evidence/docker-${{ matrix.name }}
          if-no-files-found: error

  flow-evidence:
    name: Flow Evidence
    if: always()
    needs: [unit-tests, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download flow evidence
        uses: actions/download-artifact@v4
        with:
          pattern: flow-evidence-*
          path: ${{ runner.temp }}/downloaded-evidence

      - name: Verify declared flow evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/combined-evidence"
          mkdir "$evidence"
          for artifact in "$RUNNER_TEMP"/downloaded-evidence/flow-evidence-*; do
            test -d "$artifact"
            lane="${artifact##*/flow-evidence-}"
            mv "$artifact" "$evidence/$lane"
          done
          go run ./scripts/flow-evidence -catalog test/flows.json -evidence "$evidence"
