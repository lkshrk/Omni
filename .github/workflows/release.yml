name: Release

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  # CI listens only to branch pushes, so tags on tested tips need their own trigger.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Serialize runs because annotated tag and commit SHAs cannot share a per-SHA race guard.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: GoReleaser
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Annotated tag pushes set github.sha to the tag object, not its commit.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Verify CI passed for manual or tag-push release
        id: civerify
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dereference through any annotated tag to the tested commit.
          TARGET_SHA="$(git rev-parse 'HEAD^{commit}')"

          run_count="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"

          if [ "${run_count}" != "0" ]; then
            echo "Found successful CI Pipeline run for ${TARGET_SHA}."
            exit 0
          fi

          # A tag arriving mid-CI is deferred to the successful workflow_run trigger.
          pending_count="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${TARGET_SHA}" \
            -f per_page=10 \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"

          if [ "${pending_count}" != "0" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "CI for ${TARGET_SHA} is still running; deferring to the workflow_run trigger."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::No successful CI Pipeline run found for commit ${TARGET_SHA}. Run CI for this commit before releasing."
          exit 1

      - name: Check for release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No vX.Y.Z tag points at this commit; skipping release."
            exit 0
          fi
          # Tag-push and workflow_run may both reach this idempotent publish step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          git checkout "$TAG"

      - name: Set up Go
        if: steps.tag.outputs.tag != '' && steps.civerify.outputs.skip != 'true'
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser
        if: steps.tag.outputs.tag != '' && steps.civerify.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Update Homebrew formula
        if: steps.tag.outputs.tag != '' && steps.civerify.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/lkshrk/homebrew-tap.git" tap
          ./scripts/update-homebrew-formula.sh "$VERSION" dist tap
