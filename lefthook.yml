# CI runs the integration suite only after a push has already landed, and history
# here is linear and direct-to-main, so this is the last gate that still sees the
# exact tree being published. Feature branches stay fast; only main pays for it.
pre-push:
  commands:
    integration:
      only:
        - ref: main
      run: make test-integration

pre-commit:
  commands:
    lint:
      run: make lint
    gen-schema:
      glob: "{internal/config/config.go,internal/config/loader.go,scripts/gen-schema/**}"
      run: go run ./scripts/gen-schema && git add spec/omni.settings.v*.schema.json spec/omni.settings.schema.json
