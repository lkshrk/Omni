version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: omni
    main: ./cmd/omni
    binary: omni
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lkshrk/omni/internal/cli.Version={{.Version}}

archives:
  - id: omni
    ids: [omni]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Homebrew formula (Formula/omni.rb in lkshrk/homebrew-tap) is bumped by
# scripts/update-homebrew-formula.sh in the release workflow, not goreleaser's
# `brews` publisher — that's deprecated as of goreleaser v2.10 in favor of
# homebrew_casks, but omni is a CLI binary and a formula is the correct
# distribution mechanism for it, not a cask.

nfpms:
  - id: linux-packages
    ids: [omni]
    package_name: omni
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: lkshrk
    homepage: https://github.com/lkshrk/omni
    maintainer: lkshrk <lkshrk@users.noreply.github.com>
    description: Manage all your dev tools from a single JSON config file.
    license: MIT
    bindir: /usr/bin
    formats:
      - apk
      - archlinux
      - deb
      - rpm
    dependencies:
      - stow

changelog:
  use: git
  sort: asc
  abbrev: -1
  format: "{{ .Message }}"
  groups:
    - title: Breaking Changes
      regexp: '^.*?[[:alpha:]]+(\([^)]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]+\))?!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))?!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))?!?:.+$'
      order: 3
    - title: Maintenance
      regexp: '^.*?(build|chore|ci|refactor|style|test)(\([^)]+\))?!?:.+$'
      order: 4
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^.*?Merge pull request'
      - '^.*?Merge branch'

release:
  mode: keep-existing
  draft: false
